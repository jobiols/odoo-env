name: pre-commit

on:
  push:
    branches:
      - master*

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        name: Checkout del repositorio

      - uses: actions/setup-python@v6
        name: Instalar Python
        with:
          python-version: '3.12.3'

      - uses: actions/cache@v5
        name: Cache pre-commit
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Instalar pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Ejecutar pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Instalar Graphviz (requerido por PlantUML)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      # -----------------------------
      # Render PlantUML → SVG
      # -----------------------------

      - name: Instalar Java (PlantUML)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar PlantUML
        run: |
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Renderizar UML a SVG
        run: |
          java -jar plantuml.jar -tsvg doc/uml/classes_odoo_env.plantuml

      # -----------------------------
      # Verificación de diffs
      # -----------------------------

      - name: Verificar que el SVG esté actualizado
        run: |
          if ! git diff --exit-code; then
            echo "❌ El SVG de PlantUML no está actualizado."
            echo "👉 Ejecutá PlantUML y commiteá el SVG generado."
            git diff
            exit 1
          fi
